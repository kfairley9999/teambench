name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
      - name: Mypy
        run: python -m mypy --strict src
      - name: Pytest
        run: python -m pytest --cov=teambench --cov-fail-under=90

  benchmark:
    name: mock benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Replay the published mock benchmark
        run: >
          python -m teambench run
          --model mock
          --repeats 5
          --seed 2026
          --fallibility 0.1
          --notes "CI replay of the published mock baseline."
          --output /tmp/mock.json
      - name: Published results match this run
        run: python -m teambench compare results/mock.json /tmp/mock.json
